<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Face Generator{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    
    {% block head_extra %}{% endblock %}
</head>
<body>

    <main class="container py-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="row justify-content-center mb-3">
                    <div class="col-lg-8 col-xl-7">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- <script>
        // live API status
        fetch('/health').then(r => r.json()).then(d => {
            const dot = document.getElementById('api-dot');
            const txt = document.getElementById('api-status-text');
            if (d.status) { dot.classList.add('ok'); txt.textContent = 'API online'; }
            else          { dot.classList.add('fail'); txt.textContent = 'API offline'; }
        }).catch(() => {
            document.getElementById('api-dot').classList.add('fail');
            document.getElementById('api-status-text').textContent = 'API offline';
        });
    </script> -->
    {% block scripts %}{% endblock %}
</body>
</html>
